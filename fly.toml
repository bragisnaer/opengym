app = "bragi-opengym"
primary_region = "arn"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  RP_ID = "bragi-opengym.fly.dev"
  ORIGIN = "https://bragi-opengym.fly.dev"
  RP_NAME = "openGym"
  ALLOW_GUEST = "0"
  MEDIA_QUOTA_MB = "100"

[mounts]
  source = "opengym_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"